name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  SOLUTION_PATH: ./Aion2Flow.slnx
  PROJECT_PATH: ./src/Aion2Flow/Aion2Flow.csproj

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Test
        run: |
          dotnet test --solution ${{ env.SOLUTION_PATH }} -c Release --no-build --max-parallel-test-modules 1 2>&1 | Tee-Object -FilePath test-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path test-output.log -Pattern '(failed|Assert\.|Exception|Expected|Actual)' |
              Select-Object -First 60 |
              ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            exit $code
          }

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o "$env:RUNNER_TEMP\publish"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Aion2Flow-custom
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
          retention-days: 30
